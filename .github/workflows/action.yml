name: tg-report
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'ID (если нет - оставь пустым)'
        required: false
        default: ''
      username:
        description: 'Список ботов через ЗАПЯТУЮ (без @)'
        required: true
      total_requests:
        description: 'Сколько жалоб на КАЖДОГО бота?'
        required: true
        default: '3'
      reason:
        description: 'Причина (1-Наркотики, 2-Спам, 3-Порно...)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests colorama
      - name: Start
        env:
          U_ID: ${{ inputs.user_id }}
          U_NAME: ${{ inputs.username }}
          U_COUNT: ${{ inputs.total_requests }}
          U_REASON: ${{ inputs.reason }}
        run: |
          python -c "
          import os, builtins
          
          # Передаем данные в скрипт: ID, Список, Пустая ссылка, Кол-во, Причина
          ans = [
              os.environ.get('U_ID', ''), 
              os.environ.get('U_NAME', ''), 
              '', 
              os.environ.get('U_COUNT', '3'), 
              os.environ.get('U_REASON', '1')
          ]
          def f(p=''): return ans.pop(0) if ans else ''
          builtins.input = f
          
          code = open('NTS.py', encoding='utf-8').read().replace('input(\"\\\\nНажмите Enter для выхода...\")', 'pass')
          exec(code)
          "
