name: Pyro Auto Report
on:
  workflow_dispatch:
    inputs:
      bots:
        description: 'Список ботов через запятую (без @)'
        required: true
        default: 'keqmtqhgep_bot, kfsqgenovp_bot'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install pyrogram tgcrypto requests
      - name: Run Script
        env:
          BOTS_LIST: ${{ inputs.bots }}
        run: python auto_report.py
