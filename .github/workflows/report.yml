name: Telegram Report Tool

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'ID пользователя/канала'
        required: true
        type: string
      username:
        description: 'Юзернейм (@username)'
        required: true
        type: string
      link:
        description: 'Ссылка на нарушение (если есть)'
        required: false
        type: string
        default: 'нет'
      total_requests:
        description: 'Количество жалоб'
        required: true
        type: string
        default: '50'
      complaint_type:
        description: 'Тип жалобы (Спам, Порнография, Мошенничество и т.д.)'
        required: true
        type: string
        default: 'Спам'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests colorama

      - name: Create runner
        run: |
          cat << 'EOF' > runner.py
          import os
          import sys
          
          # Настройки из GitHub Actions
          os.environ['GITHUB_USER_ID'] = os.environ.get('USER_ID', '')
          os.environ['GITHUB_USERNAME'] = os.environ.get('USERNAME', '')
          os.environ['GITHUB_LINK'] = os.environ.get('LINK', '')
          os.environ['GITHUB_TOTAL'] = os.environ.get('TOTAL_REQUESTS', '50')
          os.environ['GITHUB_TYPE'] = os.environ.get('COMPLAINT_TYPE', 'Спам')
          
          # Читаем ваш скрипт
          with open('NTS.py', 'r', encoding='utf-8') as f:
              code = f.read()
          
          # Подменяем функцию ввода
          mock_input = """
          def get_user_input():
              import os
              return (
                  os.environ.get('GITHUB_USER_ID'),
                  os.environ.get('GITHUB_USERNAME'),
                  os.environ.get('GITHUB_LINK'),
                  int(os.environ.get('GITHUB_TOTAL', 50)),
                  os.environ.get('GITHUB_TYPE')
              )
          """
          
          import re
          code = re.sub(r'def get_user_input\(\):.*?return user_id, user, id, total_requests, chosen_complaint_type', mock_input, code, flags=re.DOTALL)
          
          # Убираем паузу в конце
          code = code.replace('input("\\nНажмите Enter для выхода...")', 'pass')
          
          # Выполняем
          exec(code)
          EOF

      - name: Run Report Script
        env:
          USER_ID: ${{ inputs.user_id }}
          USERNAME: ${{ inputs.username }}
          LINK: ${{ inputs.link }}
          TOTAL_REQUESTS: ${{ inputs.total_requests }}
          COMPLAINT_TYPE: ${{ inputs.complaint_type }}
        run: python runner.py
