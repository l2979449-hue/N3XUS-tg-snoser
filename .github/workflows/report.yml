name: Telegram Report Tool

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'ID пользователя/канала'
        required: true
        type: string
      username:
        description: 'Юзернейм (@username)'
        required: true
        type: string
      link:
        description: 'Ссылка на нарушение (если есть)'
        required: false
        type: string
        default: 'нет'
      total_requests:
        description: 'Количество жалоб'
        required: true
        type: string
        default: '50'
      complaint_type:
        description: 'Тип жалобы'
        required: true
        type: string
        default: 'Спам'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests colorama

      - name: Run Report Script
        env:
          USER_ID: ${{ inputs.user_id }}
          USERNAME: ${{ inputs.username }}
          LINK: ${{ inputs.link }}
          TOTAL_REQUESTS: ${{ inputs.total_requests }}
          COMPLAINT_TYPE: ${{ inputs.complaint_type }}
        run: |
          python -c "
          import os
          import sys
          import builtins
          
          # Подменяем стандартный ввод, чтобы он брал данные из формы GitHub
          answers = [
              os.environ.get('USER_ID'),
              os.environ.get('USERNAME'),
              os.environ.get('LINK'),
              os.environ.get('TOTAL_REQUESTS'),
              '1' # Выбор причины (1 = первая в списке)
          ]
          
          def fake_input(prompt=''):
              if not answers:
                  return ''
              return answers.pop(0)
              
          builtins.input = fake_input
          
          # Запускаем NTS.py
          with open('NTS.py', 'r', encoding='utf-8') as f:
              code = f.read()
          
          # Убираем паузу в конце
          code = code.replace('input(\"\\\\nНажмите Enter для выхода...\")', 'pass')
          exec(code)
          "
