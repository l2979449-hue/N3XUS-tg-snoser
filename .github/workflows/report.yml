name: Telegram Report Tool

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'ID пользователя/канала'
        required: true
        type: string
      username:
        description: 'Юзернейм (@username)'
        required: true
        type: string
      link:
        description: 'Ссылка на нарушение (если есть)'
        required: false
        type: string
        default: 'нет'
      total_requests:
        description: 'Количество жалоб'
        required: true
        type: string
        default: '100'
      complaint_type:
        description: 'Тип жалобы (Спам, Порнография, Мошенничество и т.д.)'
        required: true
        type: string
        default: 'Спам'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests colorama

      - name: Run Report Script
        env:
          USER_ID: ${{ inputs.user_id }}
          USERNAME: ${{ inputs.username }}
          LINK: ${{ inputs.link }}
          TOTAL_REQUESTS: ${{ inputs.total_requests }}
          COMPLAINT_TYPE: ${{ inputs.complaint_type }}
        run: |
          # Модифицируем скрипт на лету, чтобы он брал данные из формы GitHub
          python -c "
          import os, re
          
          # Читаем ваш оригинальный файл (он должен называться NTS.py или requests.txt)
          with open('NTS.py', 'r', encoding='utf-8') as f:
              code = f.read()
          
          # Подменяем функцию ввода на данные из GitHub Actions
          mock_input = '''
def get_user_input():
    import os
    user_id = os.environ.get('USER_ID')
    user = os.environ.get('USERNAME')
    id = os.environ.get('LINK', 'нет')
    total_requests = int(os.environ.get('TOTAL_REQUESTS', '100'))
    chosen_complaint_type = os.environ.get('COMPLAINT_TYPE', 'Спам')
    return user_id, user, id, total_requests, chosen_complaint_type
'''
          code = re.sub(r'def get_user_input\(\):.*?return user_id, user, id, total_requests, chosen_complaint_type', mock_input, code, flags=re.DOTALL)
          
          # Убираем паузу в конце
          code = code.replace('input(\"\\\\nНажмите Enter для выхода...\")', 'pass')
          
          # Запускаем
          exec(code)
          "
