name: Report

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'ID'
        required: true
      username:
        description: 'Username'
        required: true
      link:
        description: 'Link'
        required: false
        default: 'нет'
      total_requests:
        description: 'Кол-во'
        required: true
        default: '50'
      complaint_type:
        description: 'Тип (Спам/Наркотики)'
        required: true
        default: 'Спам'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests colorama
      - name: Run
        env:
          USER_ID: ${{ inputs.user_id }}
          USERNAME: ${{ inputs.username }}
          LINK: ${{ inputs.link }}
          TOTAL_REQUESTS: ${{ inputs.total_requests }}
          COMPLAINT_TYPE: ${{ inputs.complaint_type }}
        run: |
          python -c "
          import os, builtins
          answers = [os.environ.get('USER_ID'), os.environ.get('USERNAME'), os.environ.get('LINK'), os.environ.get('TOTAL_REQUESTS'), '1']
          def fake_input(p=''):
              return answers.pop(0) if answers else ''
          builtins.input = fake_input
          code = open('NTS.py', encoding='utf-8').read().replace('input(\"\\\\nНажмите Enter для выхода...\")', 'pass')
          exec(code)
          "
